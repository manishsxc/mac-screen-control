name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scripts:
    name: Shell Scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Shell Scripts
        run: shellcheck install.sh uninstall.sh stop_server.sh macos-server/*.sh scripts/*.sh

  android:
    name: Android Client (Test, Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f displaymac-debug.jks ]; then
            keytool -genkey -v -keystore displaymac-debug.jks -storepass android -alias displaymac -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DisplayMac, OU=Dev, O=DisplayMac, L=City, S=State, C=IN"
          fi
      - name: Run Unit Tests, Lint & Assemble Debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
