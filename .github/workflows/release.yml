name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DisplayMac-Android-APKs
          path: android-client/app/build/outputs/apk/debug/app-debug.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DisplayMac-Android-APKs
          path: artifacts/
      - name: Prepare macOS Package from Release Artifacts
        run: |
          cp release-artifacts/DisplayMac-macOS.zip artifacts/
      - name: Publish Release (Direct on Push or Tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "DisplayMac v1.0.0 (macOS 26/27+ & Android 10+)"
          files: |
            artifacts/*.apk
            artifacts/DisplayMac-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
