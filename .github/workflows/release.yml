name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DisplayMac-Android-APKs
          path: android-client/app/build/outputs/apk/debug/app-debug.apk

  build-macos:
    name: Build macOS Application
    runs-on: macos-13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS App
        working-directory: macos-server
        run: |
          swift build -c release
          mkdir -p /tmp/DisplayMac.app/Contents/MacOS
          mkdir -p /tmp/DisplayMac.app/Contents/Resources
          cp .build/release/DisplayMacServer /tmp/DisplayMac.app/Contents/MacOS/DisplayMac
          
          # Create Info.plist
          cat << 'EOF' > /tmp/DisplayMac.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DisplayMac</string>
              <key>CFBundleIdentifier</key>
              <string>com.displaymac.app</string>
              <key>CFBundleName</key>
              <string>DisplayMac</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.3</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          cd /tmp
          zip -r DisplayMac-macOS.zip DisplayMac.app
      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayMac-macOS-App
          path: /tmp/DisplayMac-macOS.zip

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DisplayMac-Android-APKs
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: DisplayMac-macOS-App
          path: artifacts/
      - name: Publish Release (Always on Push or Tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "DisplayMac v1.0.0"
          files: |
            artifacts/*.apk
            artifacts/DisplayMac-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
